# GitHub Actions only loads workflows under .github/workflows/.
# actions/checkout@v4, actions/setup-node@v4, and actions/upload-artifact@v4
# declare Node 20, which GitHub-hosted runners removed on 2026-09-23.
# v5, v5, and v6 are the oldest majors that declare Node 24.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Headless browser smoke test
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" npm run smoke
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: artifacts/*.png
